# Modrix Commerce local development stack.
#
#   docker compose up -d --build
#   docker compose exec app composer install
#   docker compose exec app npm ci && docker compose exec app npm run build
#   docker compose exec app php artisan key:generate
#   docker compose exec app php artisan migrate
#   docker compose exec app php artisan ecomodular:install
#
# The site is served at http://127.0.0.1:8080 and Mailpit at http://127.0.0.1:8025.
# MySQL and Redis are NOT published to the host. All credentials below are
# DEVELOPMENT-ONLY placeholders: never reuse them in production.

x-app: &app
    build:
        context: .
        dockerfile: docker/php/Dockerfile
        target: dev
    volumes:
        - ./:/var/www/html
    environment:
        DB_CONNECTION: mysql
        DB_HOST: mysql
        DB_PORT: 3306
        DB_DATABASE: ecomodular
        DB_USERNAME: ecomodular
        DB_PASSWORD: dev-only-password
        REDIS_HOST: redis
        CACHE_STORE: redis
        QUEUE_CONNECTION: redis
        SESSION_DRIVER: redis
        MAIL_MAILER: smtp
        MAIL_HOST: mailpit
        MAIL_PORT: 1025
    depends_on:
        mysql:
            condition: service_healthy
        redis:
            condition: service_started

services:
    app:
        <<: *app

    queue:
        <<: *app
        command:
            ['php', 'artisan', 'queue:work', '--tries=3', '--max-time=3600']
        restart: unless-stopped

    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
        restart: unless-stopped

    web:
        image: nginx:1.27-alpine
        ports:
            - '127.0.0.1:8080:80'
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ecomodular
            MYSQL_USER: ecomodular
            MYSQL_PASSWORD: dev-only-password
            MYSQL_ROOT_PASSWORD: dev-only-root-password
        command:
            [
                '--character-set-server=utf8mb4',
                '--collation-server=utf8mb4_unicode_ci',
            ]
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    '127.0.0.1',
                    '-uroot',
                    '-pdev-only-root-password',
                ]
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        image: redis:7-alpine
        volumes:
            - redis-data:/data

    mailpit:
        image: axllent/mailpit:v1.21
        ports:
            - '127.0.0.1:8025:8025'

volumes:
    mysql-data:
    redis-data:
