; EcoModular PHP overrides
expose_php = Off
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 60
date.timezone = UTC

session.cookie_httponly = 1
session.use_strict_mode = 1

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Development: re-check file timestamps. Set to 0 in production and reload FPM on deploy.
opcache.validate_timestamps = 1
