server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Product images and theme uploads. The marketplace server needs
    # ECOMODULAR_MARKETPLACE_MAX_PACKAGE_MB (50 MB) here instead.
    client_max_body_size 24m;
    server_tokens off;

    # Security headers for application responses (CSP, frame denial, HSTS…)
    # come from the SecurityHeaders middleware. Do not add them here as
    # well: duplicated, conflicting values can make browsers ignore them.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Fingerprinted build assets: cache for a year.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Uploaded media (storage:link): never sniffed or executed as documents.
    location /storage/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Never serve dotfiles (.env, .git) even if they end up under public/.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.php$ {
        # Only the front controller may execute; uploaded or stray PHP files are never run.
        location ~ ^/(?!index\.php$) { return 404; }
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }
}
